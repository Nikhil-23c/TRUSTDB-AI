<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEURA-X — Trusted AI for Your Data</title>
  <meta name="description" content="Ask your data anything. Neura-X finds the answer, verifies it against the database, and shows you why you can trust it." />

  <!-- Preconnect to Google Fonts for Ultra-Fast Editorial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cinzel"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            base: '#0B0D0F',
            surface: {
              DEFAULT: '#121518',
              soft: '#181C20',
              elevated: '#1D2228',
              hover: '#222830'
            },
            champagne: {
              DEFAULT: '#C6A76B',
              hover: '#D8BC82',
              dim: 'rgba(198, 167, 107, 0.12)',
              glow: 'rgba(198, 167, 107, 0.25)'
            },
            verified: {
              DEFAULT: '#7FA58C',
              bg: 'rgba(127, 165, 140, 0.12)',
              border: 'rgba(127, 165, 140, 0.35)'
            },
            warning: {
              DEFAULT: '#B99A62',
              bg: 'rgba(185, 154, 98, 0.12)',
              border: 'rgba(185, 154, 98, 0.35)'
            },
            danger: {
              DEFAULT: '#B86D6D',
              bg: 'rgba(184, 109, 109, 0.12)',
              border: 'rgba(184, 109, 109, 0.35)'
            }
          },
          letterSpacing: {
            widest: '0.15em',
            ultra: '0.25em'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js for Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Cinematic Luxury Styles -->
  <link rel="stylesheet" href="/static/styles.css?v=2" />
</head>
<body class="bg-[#0B0D0F] text-[#F4F1EA] antialiased selection:bg-[#C6A76B] selection:text-[#0B0D0F] min-h-screen">
  <div id="root"></div>

  <!-- Pure Fast React App Script -->
  <script src="/static/app.js?v=2"></script>
</body>
</html>
