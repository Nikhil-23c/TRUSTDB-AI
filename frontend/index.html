<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEURA-X — Trusted AI Database Assistant</title>
  <meta name="description" content="Ask your data anything. Neura-X verifies every claim against the database, intercepts hallucinations, and delivers mathematically grounded truth." />

  <!-- Pre-apply theme class to prevent flash of wrong theme -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('neura_theme') || 'dark';
      document.documentElement.className = savedTheme;
    })();
  </script>

  <!-- Preconnect to Google Fonts for Ultra-Fast Editorial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cinzel"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          letterSpacing: {
            widest: '0.15em',
            ultra: '0.25em'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Chart.js for Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Cinematic Luxury Styles -->
  <link rel="stylesheet" href="/static/styles.css?v=6" />
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <!-- React App Script -->
  <script src="/static/app.js?v=6"></script>
</body>
</html>
